services:
  db:
    image: postgres:16
    container_name: clinica-db
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
    ports:
      # host:container -- o Postgres DENTRO do container continua na 5432.
      # Quem atende na 5433 e a sua maquina. Evita briga com um Postgres
      # nativo instalado no Windows, que costuma ocupar a 5432.
      - "5433:5432"
    volumes:
      # volume nomeado: os dados sobrevivem a "docker compose down".
      # Para zerar o banco de verdade: docker compose down -v
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
